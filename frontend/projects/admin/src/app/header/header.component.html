<div class='container'>
    <div class='menu-button' (click)='active = true'></div>
    <h1 [routerLink]="['/', api.workspaceId()]" queryParamsHandling="preserve">ממשק ניהול - <strong>{{api.cityName()}}</strong></h1>
    <a class='logo' [routerLink]="['/', api.workspaceId()]" queryParamsHandling="preserve">
        <span>מפת הטף</span>
    </a>
    <div class='sep'></div>
    <a class='pkw' href='https://www.hasadna.org.il' target='_blank'>
    </a>
</div>
@if (api.mode() === 'admin') {
    <nav class='tabs'>
        <a [routerLink]="['/', api.workspaceId()]" queryParamsHandling="preserve"
           routerLinkActive='active' #dashboard='routerLinkActive' [routerLinkActiveOptions]='EXACT_PATH'>תמונת מצב</a>
        <a [routerLink]="['/', api.workspaceId(), 'items']" queryParamsHandling="preserve"
           [class.active]='!dashboard.isActive'>עריכת המסגרות</a>
    </nav>
}
<div class='menu' [class.active]='active' (click)='active=false; true'>
    <a href='#link'>מדריך שימוש</a>
    <a href='#link'>תמיכה טכנית</a>
    <div class='close'></div>
</div>
