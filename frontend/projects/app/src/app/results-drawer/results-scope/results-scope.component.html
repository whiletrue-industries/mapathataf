@let count = state.resultCount();
<div class='count'>
    @if (state.scoped()) {
        <span class='visible'>{{ count.visible }}</span><span class='sep'>/</span><span class='total'>{{ count.total }}</span>
    } @else {
        <span class='total'>{{ count.total }}</span>
    }
</div>
<div class='label'>תוצאות</div>
<div class='scope'>
    <a class='option' [class.selected]='state.mapScope() === "city"' (click)='setScope("city")'>בכל הרשות</a>
    <a class='option' [class.selected]='state.mapScope() === "map"' (click)='setScope("map")'>באיזור המפה</a>
</div>
