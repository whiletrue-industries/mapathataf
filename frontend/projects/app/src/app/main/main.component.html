<div class='content'>
    @if (showMap) { <app-map></app-map> }
    <app-search-bar></app-search-bar>
    <app-menu></app-menu>
    @if (api.workspace().logo_url) {
        <div class='logo'><img [src]='api.workspace().logo_url' /></div>
    }
    @if (state.selectedId()) {
        <app-item-sheet></app-item-sheet>
    } @else {
        <app-results-drawer></app-results-drawer>
    }
</div>
@if (state.filterOptions() !== null) {
    <app-filter-sheet></app-filter-sheet>
}
@if (onboarding.visible()) {
    <app-onboarding></app-onboarding>
}
