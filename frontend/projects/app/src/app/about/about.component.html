<app-page-header (close)='close()'></app-page-header>
<div class='content'>
    @switch (section()) {
        @case ('how-to-choose') {
            <app-markdown src='choosing-an-educational-framework' [accordion]='true'></app-markdown>
        }
        @case ('city') {
            @if (cityPage(); as page) {
                <h1 class='city-title'>{{ cityPageTitle() }}</h1>
                @if (page.subtitle) {
                    <p class='city-subtitle'>{{ page.subtitle }}</p>
                }
                <app-markdown [markdown]='page.content!' [categoryIcons]='true'></app-markdown>
            }
        }
        @case ('custom') {
            <app-markdown [src]='href()'></app-markdown>
        }
        @case ('about') {
            <app-markdown src='about'></app-markdown>
        }
        @case ('terms-of-use') {
            <app-markdown src='terms-of-use'></app-markdown>
        }
        @case ('accessibility') {
            <app-markdown src='accessibility'></app-markdown>
        }
        @default {
            <div class='not-found'>Page not found</div>
        }
    }
</div>
